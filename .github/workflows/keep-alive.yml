# Pings both Render free-tier services every 10 minutes so they never sit idle
# long enough to spin down (Render's free plan sleeps a service after ~15 min
# of inactivity, then takes up to ~50s to wake on the next request -- which
# was causing login timeouts on the old Plotly Dash dashboard, since replaced
# by the React frontend in frontend/. The cold-start-latency risk this guards
# against is unrelated to that rewrite -- it still applies to any frontend
# waiting on a cold backend, so this workflow stays.
#
# Public repo -> GitHub Actions minutes are unlimited and free, so running
# this every 10 minutes costs nothing. Note GitHub may delay scheduled runs
# by a few minutes under load, and disables schedules after 60 days with no
# repo activity (any push resets that clock).
name: Keep Render services warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend API health check
        run: curl -sf --max-time 90 https://sepsis-icu-api.onrender.com/health

      - name: Ping frontend
        run: curl -sf --max-time 90 https://sepsis-icu-frontend.onrender.com/
